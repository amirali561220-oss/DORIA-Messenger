# Demo-only free deployment. SQLite data on free instances is ephemeral.
services:
  - type: web
    name: doria-messenger
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DORIA_ENV
        value: production
      - key: DORIA_SECRET_KEY
        generateValue: true
      - key: DORIA_DB_PATH
        value: /tmp/doria.db
